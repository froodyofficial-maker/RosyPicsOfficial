<body>

</div>
<iframe name="rosypics-mail-frame" title="RosyPics email transport" style="position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;border:0;opacity:0"></iframe>

<header class="nav">

  </div>
  <nav class="nav-links">

    <button class="nav-link" data-page="cg">Custom CG</button>

  </nav>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const IMG={
  'thumb-pop.jpg': 'images/thumb-pop.jpg',
  'reference-pop.png': 'images/reference-pop.png',
  'reference-thanks.png': 'images/reference-thanks.png',
  'before.jpg': 'images/before.jpg',
  'reference-vibrant.png': 'images/reference-vibrant.png',
  'reference-home.png': 'images/reference-home.png',
  'pop.jpg': 'images/pop.jpg',
  'vibrant.jpg': 'images/vibrant.jpg',
  'thumb-raw.jpg': 'images/thumb-raw.jpg',
  'angry-rosy.jpg': 'images/angry-rosy.jpg',
  'reference-purchase.png': 'images/reference-purchase.png',
  'thumb-vibrant.jpg': 'images/thumb-vibrant.jpg',
  'midnight-rosy-1.jpg': 'images/midnight-rosy-1.jpg',
  'midnight-rosy-2.jpg': 'images/midnight-rosy-2.jpg'
,
  'interested-1-raw.png': 'images/interested-1-raw.png',
  'interested-1-pop.png': 'images/interested-1-pop.png',
  'interested-2-raw.png': 'images/interested-2-raw.png',
  'interested-2-pop.png': 'images/interested-2-pop.png',
  'interested-3-raw.png': 'images/interested-3-raw.png',
  'interested-3-pop.png': 'images/interested-3-pop.png'
};
const ANGRY4K='images/angry-rosy-4k.jpg';
const ANGRY_RAW='images/angry-rosy-raw.png';
const ANGRY_CC='images/angry-rosy-sunshine-cc.png';
const ASSET='';
const RAZORPAY_KEY_ID=localStorage.getItem('rosypics-razorpay-key')||'';
const AI_PRICE=12;
const state={
  page:'home',
  cart: JSON.parse(localStorage.getItem('rosypics-cart')||'[]'),
  purchasedPhotos: JSON.parse(localStorage.getItem('rosypics-purchased-photos')||'[]'),
  purchasedBundles: JSON.parse(localStorage.getItem('rosypics-purchased-bundles')||'[]'),
  orders: JSON.parse(localStorage.getItem('rosypics-orders')||'[]'),
  selectedCG:'Vibrant',
  overviewVersion:'raw',
  uploads:{Vibrant:null,Pop:null},
  email:localStorage.getItem('rosypics-email')||'',
  giftBalance:Number(localStorage.getItem('rosypics-gift-balance')||0),
  giftCards:JSON.parse(localStorage.getItem('rosypics-gift-cards')||'{}'),
  paymentMethod:'card',
  giftCode:'',
  giftApplied:0,
  lastOrder:[],
  interestedVariants:['raw','raw','raw'],
  mypicsTab:localStorage.getItem('rosypics-mypics-tab')||'downloads',
  albums:JSON.parse(localStorage.getItem('rosypics-albums')||'[]'),
  activeAlbumId:null,
  bookPage:0,
  bookTheme:localStorage.getItem('rosypics-book-theme')||'dark',
  collector:localStorage.getItem('rosypics-collector')==='1',
  profileName:localStorage.getItem('rosypics-profile-name')||'',
  profilePfp:localStorage.getItem('rosypics-profile-pfp')||'',
  orbitImages:JSON.parse(localStorage.getItem('rosypics-orbit-images')||'[]'),
  aiUpscales:Number(localStorage.getItem('rosypics-ai-upscales')||0)
};

const products={
  angry:{name:'Angry Rosy',price:29,img:IMG['angry-rosy.jpg'],downloads:[
  {name:'Angry Rosy — 4K',url:ANGRY4K,file:'Angry-Rosy-4K.jpg'},
  {name:'Angry Rosy — Raw',url:ANGRY_RAW,file:'Angry-Rosy-Raw.png'},
  {name:'Angry Rosy — Sunshine CC',url:ANGRY_CC,file:'Angry-Rosy-Sunshine-CC.png'}
]},
  midnight:{name:'Midnight with Rosy',price:59,img:IMG['midnight-rosy-1.jpg'],bundle:true,downloads:[{name:'Midnight with Rosy — Photo 1',url:IMG['midnight-rosy-1.jpg'],file:'Midnight-with-Rosy-1.jpg'},{name:'Midnight with Rosy — Photo 2',url:IMG['midnight-rosy-2.jpg'],file:'Midnight-with-Rosy-2.jpg'}]},
  interested:{name:'Interested Rosy Bundle',price:179,img:IMG['interested-1-raw.png'],bundle:true,downloads:[{name:'Interested Rosy — Photo 1 — Original',url:IMG['interested-1-raw.png'],file:'Interested-Rosy-1-Original.png'},{name:'Interested Rosy — Photo 1 — Pop CC',url:IMG['interested-1-pop.png'],file:'Interested-Rosy-1-Pop-CC.png'},{name:'Interested Rosy — Photo 2 — Original',url:IMG['interested-2-raw.png'],file:'Interested-Rosy-2-Original.png'},{name:'Interested Rosy — Photo 2 — Pop CC',url:IMG['interested-2-pop.png'],file:'Interested-Rosy-2-Pop-CC.png'},{name:'Interested Rosy — Photo 3 — Original',url:IMG['interested-3-raw.png'],file:'Interested-Rosy-3-Original.png'},{name:'Interested Rosy — Photo 3 — Pop CC',url:IMG['interested-3-pop.png'],file:'Interested-Rosy-3-Pop-CC.png'}]},
  Vibrant:{name:'Vibrant CC',price:99,img:IMG['thumb-vibrant.jpg']},
  Pop:{name:'Pop CC',price:99,img:IMG['thumb-pop.jpg']},
  gift300:{name:'₹300 Gift Card',price:300,img:IMG['thumb-vibrant.jpg'],gift:300},
  gift600:{name:'₹600 Gift Card',price:600,img:IMG['thumb-vibrant.jpg'],gift:600},
  gift1200:{name:'₹1200 Gift Card',price:1200,img:IMG['thumb-vibrant.jpg'],gift:1200},
  gift2400:{name:'₹2400 Gift Card',price:2400,img:IMG['thumb-vibrant.jpg'],gift:2400}
};

function money(n){return '₹'+n}
function midnightDeadline(){
  let d=Number(localStorage.getItem('rosypics-midnight-deadline')||0);
  if(!d || d<=Date.now()){d=Date.now()+8*24*60*60*1000;localStorage.setItem('rosypics-midnight-deadline',String(d));}
  return d;
}
function midnightTimeLeft(){return Math.max(0,midnightDeadline()-Date.now())}
function formatMidnightTime(ms){
  const total=Math.floor(ms/1000),days=Math.floor(total/86400),hours=Math.floor((total%86400)/3600),mins=Math.floor((total%3600)/60),secs=total%60;
  return `${days}d ${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s`;
}
function midnightExpired(){return midnightTimeLeft()<=0}
function makeGiftCode(amount){
  return 'ROSY-'+Number(amount).toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
}
function giftAmount(item){
  if(item && item.gift) return Number(item.gift);
  const m=String(item?.name||'').match(/₹\s*([0-9,]+)/);
  return m ? Number(m[1].replace(/,/g,'')) : 0;
}
function save(){localStorage.setItem('rosypics-cart',JSON.stringify(state.cart));localStorage.setItem('rosypics-purchased-photos',JSON.stringify(state.purchasedPhotos));localStorage.setItem('rosypics-purchased-bundles',JSON.stringify(state.purchasedBundles));localStorage.setItem('rosypics-orders',JSON.stringify(state.orders));localStorage.setItem('rosypics-gift-balance',String(state.giftBalance));localStorage.setItem('rosypics-gift-cards',JSON.stringify(state.giftCards));localStorage.setItem('rosypics-albums',JSON.stringify(state.albums||[]));localStorage.setItem('rosypics-collector',state.collector?'1':'0');localStorage.setItem('rosypics-book-theme',state.bookTheme||'dark');localStorage.setItem('rosypics-profile-name',state.profileName||'');localStorage.setItem('rosypics-profile-pfp',state.profilePfp||'');localStorage.setItem('rosypics-orbit-images',JSON.stringify(state.orbitImages||[]));localStorage.setItem('rosypics-ai-upscales',String(state.aiUpscales||0));if(state.email)localStorage.setItem('rosypics-email',state.email)}
const CC_EMAIL='froodyofficial@gmail.com';
function copyGiftCode(code){
  const done=()=>toast('Gift card code copied');
  if(navigator.clipboard && window.isSecureContext){navigator.clipboard.writeText(code).then(done).catch(()=>fallbackCopy(code,done));}
  else fallbackCopy(code,done);
}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copy failed — select the code manually')}ta.remove();}
function libraryAssets(){
  const a=[];
  if(state.purchasedPhotos.includes('angry')){
    a.push({id:'angry-4k',name:'Angry Rosy — 4K',url:ANGRY4K});
    a.push({id:'angry-raw',name:'Angry Rosy — Raw',url:ANGRY_RAW});
    a.push({id:'angry-cc',name:'Angry Rosy — Sunshine CC',url:ANGRY_CC});
  }
  if(state.purchasedBundles.includes('midnight')){
    a.push({id:'midnight-1',name:'Midnight with Rosy — Photo 1',url:IMG['midnight-rosy-1.jpg']});
    a.push({id:'midnight-2',name:'Midnight with Rosy — Photo 2',url:IMG['midnight-rosy-2.jpg']});
  }
  if(state.purchasedBundles.includes('interested')){
    [1,2,3].forEach(n=>{a.push({id:`interested-${n}-original`,name:`Interested Rosy — Photo ${n} — Original`,url:IMG[`interested-${n}-raw.png`]});a.push({id:`interested-${n}-pop`,name:`Interested Rosy — Photo ${n} — Pop CC`,url:IMG[`interested-${n}-pop.png`]});});
  }
  return a;
}
function getAlbum(id){return (state.albums||[]).find(a=>a.id===id)}
function setMyPicsTab(tab){state.mypicsTab=tab;localStorage.setItem('rosypics-mypics-tab',tab);render()}
function createAlbum(){
  const name=prompt('Name your Rosy album:');
  if(!name || !name.trim())return;
  const album={id:'album-'+Date.now(),name:name.trim(),items:[]};
  state.albums.push(album);state.activeAlbumId=album.id;state.mypicsTab='albums';save();render();toast('Album created');
}
function openAlbum(id){state.activeAlbumId=id;state.mypicsTab='albums';render()}
function openAlbumBook(id){state.activeAlbumId=id;state.bookPage=0;state.page='albumbook';render();window.scrollTo({top:0,behavior:'smooth'})}
function addToAlbum(albumId,assetId){
  const album=getAlbum(albumId);if(!album)return;
  if(!album.items.includes(assetId)){album.items.push(assetId);save();render();toast('Added to album')}
}
function removeFromAlbum(albumId,assetId){const album=getAlbum(albumId);if(!album)return;album.items=album.items.filter(x=>x!==assetId);save();render();}
function reorderAlbum(albumId,fromId,toId){const album=getAlbum(albumId);if(!album)return;const from=album.items.indexOf(fromId),to=album.items.indexOf(toId);if(from<0||to<0||from===to)return;album.items.splice(from,1);album.items.splice(to,0,fromId);save();render()}
function deleteAlbum(id){if(!confirm('Delete this album? The photos will remain in Downloads.'))return;state.albums=state.albums.filter(a=>a.id!==id);if(state.activeAlbumId===id)state.activeAlbumId=null;save();render();}
function albumTabHtml(){
  const assets=libraryAssets();
  const albums=state.albums||[];
  const active=getAlbum(state.activeAlbumId);
  if(!assets.length)return `<div class="empty"><h2>Your album shelf is empty</h2><p>Buy Rosy photos first, then organize them into albums like a little photo book.</p></div>`;
  return `<div class="album-toolbar"><div><h2>Album Shelf</h2><p style="margin:6px 0 0;color:#888">Drag photos into an album, arrange them, then open the album as a book.</p></div><button class="green-btn buy-btn-small" id="create-album">+ New Album</button></div>
    ${albums.length?`<div class="album-grid">${albums.map(al=>{const imgs=al.items.map(id=>assets.find(x=>x.id===id)).filter(Boolean).slice(0,4);return `<article class="album-card"><div class="album-cover">${imgs.length?imgs.map(x=>`<img src="${x.url}" alt="${x.name}">`).join(''):`<div style="grid-column:1/-1;display:grid;place-items:center;color:#555">Empty album</div>`}</div><h3>${escapeHtml(al.name)}</h3><p>${al.items.length} photo${al.items.length===1?'':'s'}</p><div class="album-card-actions"><button class="download-btn" data-open-album="${al.id}">Organize</button><button class="download-btn" data-book-album="${al.id}">Open Book</button><button class="remove-btn" data-delete-album="${al.id}">Delete</button></div></article>`}).join('')}</div>`:`<div class="empty"><h2>No albums yet</h2><p>Create your first album and drag your purchased photos into it.</p></div>`}
    ${active?`<div class="album-dropzone" id="album-dropzone"><h3>Organizing: ${escapeHtml(active.name)}</h3><p>Drop a photo here to add it. Drag photos inside the album to reorder them.</p><div class="album-items">${active.items.length?active.items.map(id=>{const x=assets.find(y=>y.id===id);return x?`<div class="album-item" draggable="true" data-album-item="${x.id}" data-album-id="${active.id}"><img src="${x.url}" alt="${x.name}"><div class="album-item-copy">${escapeHtml(x.name)} <button class="remove-btn" data-remove-album-item="${x.id}" data-album-id="${active.id}">Remove</button></div></div>`:''}).join(''):`<div class="album-empty" style="grid-column:1/-1">Drop photos here to start your book.</div>`}</div></div><h3 style="margin:30px 0 0">Your Collection — drag into the album</h3><div class="collection-strip">${assets.map(x=>`<div class="collection-tile" draggable="true" data-asset-id="${x.id}"><img src="${x.url}" alt="${x.name}"><span>${escapeHtml(x.name)}</span>${active.items.includes(x.id)?'<b class="in-album">IN ALBUM</b>':''}</div>`).join('')}</div>`:''}`;
}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setBookTheme(theme){
  if(!['dark','cream','green','graphite'].includes(theme))theme='dark';
  state.bookTheme=theme;
  localStorage.setItem('rosypics-book-theme',theme);
  render();
}
function albumBook(){
  const album=getAlbum(state.activeAlbumId),assets=libraryAssets();
  if(!album)return `<section class="subpage"><button class="overview-back" onclick="go('mypics')">← Back to MyPics</button><div class="empty"><h2>Album not found</h2></div></section>`;
  const items=album.items.map(id=>assets.find(x=>x.id===id)).filter(Boolean);
  if(!items.length)return `<section class="subpage"><button class="overview-back" onclick="go('mypics')">← Back to MyPics</button><div class="empty"><h2>${escapeHtml(album.name)} is empty</h2><p>Add photos in the Album tab first.</p><button class="green-btn" onclick="go('mypics')">Organize Album</button></div></section>`;
  const pages=Math.ceil(items.length/2);state.bookPage=Math.max(0,Math.min(state.bookPage,pages-1));const left=items[state.bookPage*2],right=items[state.bookPage*2+1];
  const theme=state.bookTheme||'dark';
  const themes=[['dark','Rosy Dark'],['graphite','Graphite'],['green','Rosy Green'],['cream','Cream']];
  return `<section class="subpage"><button class="overview-back" onclick="go('mypics')">← Back to MyPics</button><div class="bundle-kicker">RosyPics Album</div><h1>${escapeHtml(album.name)}</h1><p class="subtitle">Your collection, arranged as a photo book — styled your way.</p><div class="book-wrap"><div class="book-theme-picker"><strong>Book colour</strong>${themes.map(([id,label])=>`<button class="book-theme ${theme===id?'active':''}" onclick="setBookTheme('${id}')">${label}</button>`).join('')}</div><div class="book-stage theme-${theme}"><div class="book-page"><div class="book-sheet"><img src="${left.url}" alt="${left.name}"><div class="book-caption">${escapeHtml(left.name)}</div><div class="book-number">Page ${state.bookPage*2+1}</div></div><div class="book-sheet">${right?`<img src="${right.url}" alt="${right.name}"><div class="book-caption">${escapeHtml(right.name)}</div><div class="book-number">Page ${state.bookPage*2+2}</div>`:`<div class="book-end">The End</div>`}</div></div></div><div class="book-controls"><button class="download-btn" id="book-prev" ${state.bookPage===0?'disabled':''}>← Previous</button><span>Spread ${state.bookPage+1} / ${pages}</span><button class="download-btn" id="book-next" ${state.bookPage>=pages-1?'disabled':''}>Next →</button></div></div></section>`;
}

function updateCartCount(){const el=document.getElementById('cart-count');if(el)el.textContent=state.cart.length}
function cartTotal(){return state.cart.reduce((s,x)=>s+x.price,0)}
function addCart(id){
  const p=products[id];
  if(!p)return;

  // Midnight is one ₹59 bundle containing both 4K files. Keep it as a
  // single cart line so the customer pays ₹59 once, while the cart still
  // shows both photos included in the bundle.
  if(p.bundle){
    const existing=state.cart.find(x=>x.id===id);
    if(existing){toast(p.name+' is already in your cart');return;}
    state.cart.push({
      id, name:p.name, price:p.price, img:p.img, gift:null, bundle:true,
      downloads:(p.downloads||[]).map(d=>({name:d.name,url:d.url,file:d.file}))
    });
  }else{
    state.cart.push({
      id,
      name:p.name,
      price:p.price,
      img:p.img,
      gift:p.gift||null,
      downloads:(p.downloads||[]).map(d=>({name:d.name,url:d.url,file:d.file}))
    });
  }
  save();
  updateCartCount();
  toast(p.name+' added to cart');
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200);
}
function go(page){
  state.page=page;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-page]');
  if(b)go(b.dataset.page);
});

function navActive(){
  document.querySelectorAll('.nav-link[data-page]').forEach(x=>{
    x.classList.toggle('active',x.dataset.page===state.page || (state.page==='purchase'&&x.dataset.page==='cg'));
  });
}

function render(){
  const app=document.getElementById('app');
  let html='';
  if(state.page==='home')html=home();
  if(state.page==='cg')html=cg();
  if(state.page==='cart')html=cart();
  if(state.page==='purchase')html=purchase();
  if(state.page==='thanks')html=thanks();
  if(state.page==='mypics')html=mypics();
  if(state.page==='pictures')html=pictures();
  if(state.page==='account')html=account();
  if(state.page==='giftshop')html=giftshop();
  if(state.page==='overview')html=pictureOverview();
  if(state.page==='midnight')html=midnightBundle();
  if(state.page==='interested')html=interestedBundle();
  if(state.page==='albumbook')html=albumBook();

function resizeToDataURL(fileOrUrl,max=256){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;img.src=fileOrUrl instanceof File?URL.createObjectURL(fileOrUrl):fileOrUrl})}
function addOrbitImage(name,url,file,sourceId,enabled){
  const saveImage=async()=>{try{const data=await resizeToDataURL(file||url,256);const id=sourceId||('custom-'+Date.now());const existing=(state.orbitImages||[]).find(x=>x.id===id);if(existing){existing.enabled=enabled;existing.data=data;existing.name=name;existing.sourceId=sourceId||existing.sourceId}else state.orbitImages.push({id,name,data,enabled:!!enabled,sourceId});save();render();toast(enabled?'Added to profile icon':'Removed from profile icon')}catch(e){toast('Could not prepare that image')}};saveImage();}
function toggleOrbit(id,enabled){const x=(state.orbitImages||[]).find(v=>v.id===id);if(x){x.enabled=enabled;save();render();}}
function deleteOrbit(id){state.orbitImages=(state.orbitImages||[]).filter(v=>v.id!==id);save();render();}
function saveProfileName(){const v=(document.getElementById('profile-name-input')?.value||'').trim().slice(0,32);state.profileName=v||'RosyPics User';save();render();toast('Profile name saved')}
function saveRazorpayKey(){const k=(document.getElementById('razorpay-key-input')?.value||'').trim();localStorage.setItem('rosypics-razorpay-key',k);toast(k?'Razorpay Key ID saved':'Razorpay Key ID cleared')}
function initProfile(){const p=document.getElementById('profile-pfp-file');if(p)p.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state.profilePfp=await resizeToDataURL(f,512);save();render();toast('Profile picture updated')}catch{toast('Could not use that image')}}}
function profileAvatarHTML(){const orbit=(state.orbitImages||[]).filter(x=>x.enabled).slice(0,3);return `<div class="profile-avatar">${state.profilePfp?`<img src="${state.profilePfp}" alt="Profile picture">`:`<span class="profile-initials">${escapeHtml((state.profileName||'RP').slice(0,2).toUpperCase())}</span>`}${orbit.map(x=>`<img class="orbit-pic" src="${x.data}" alt="">`).join('')}</div>`}

function initEnhancer(){
  const input=document.getElementById('enhance-file'),drop=document.getElementById('enhance-upload'),run=document.getElementById('enhance-run');
  if(!input||!drop||!run)return;
  let sourceFile=null,sourceBlob=null,outputBlob=null,sourceUrl=null;
  const setStatus=(t)=>{const el=document.getElementById('enhance-status');if(el)el.textContent=t};
  const loadFile=file=>{
    if(!file||!file.type.startsWith('image/')){toast('Please choose an image file');return}
    sourceFile=file;sourceBlob=file;
    if(sourceUrl)URL.revokeObjectURL(sourceUrl);sourceUrl=URL.createObjectURL(file);
    const img=new Image();img.onload=()=>{document.getElementById('enhance-source').textContent=file.name;document.getElementById('enhance-source-size').textContent=`${img.naturalWidth} × ${img.naturalHeight}`;document.getElementById('enhance-preview').innerHTML=`<img src="${sourceUrl}" alt="Enhancer preview">`;setStatus('Image loaded');};img.onerror=()=>toast('Could not read that image');img.src=sourceUrl;
  };
  input.onchange=e=>loadFile(e.target.files[0]);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
  drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
  run.onclick=async()=>{
    if(!sourceBlob){toast('Upload an image first');return}
    const paid=await requestAIUpscalePayment();if(!paid)return
    if(run.dataset.busy==='1')return;
    run.dataset.busy='1';run.disabled=true;run.textContent='Loading AI…';document.getElementById('enhance-result').classList.add('show');document.getElementById('enhance-progress-bar').style.width='5%';setStatus('Loading AI model…');
    try{
      const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.0/+esm');
      env.backends.onnx.wasm.numThreads=Math.min(4,navigator.hardwareConcurrency||2);
      const device=(navigator.gpu?'webgpu':'wasm');
      const dtype=device==='webgpu'?'fp16':'q8';
      if(!window.__rosyUpscaler){window.__rosyUpscaler=await pipeline('image-to-image','Xenova/swin2SR-realworld-sr-x4-64-bsrgan-psnr',{device,dtype});}
      document.getElementById('enhance-progress-bar').style.width='25%';setStatus(device==='webgpu'?'AI running on GPU…':'AI running in browser…');run.textContent='AI Enhancing…';
      const output=await window.__rosyUpscaler(sourceBlob);
      document.getElementById('enhance-progress-bar').style.width='82%';setStatus('Preparing 4K master…');
      const raw=output.data,width=output.width,height=output.height,channels=output.channels;
      const c=document.createElement('canvas');let targetW=width,targetH=height;
      if(Math.max(targetW,targetH)<3840){const k=3840/Math.max(targetW,targetH);targetW=Math.round(targetW*k);targetH=Math.round(targetH*k)}
      if(Math.max(targetW,targetH)>3840){const k=3840/Math.max(targetW,targetH);targetW=Math.round(targetW*k);targetH=Math.round(targetH*k)}
      const temp=document.createElement('canvas');temp.width=width;temp.height=height;const tctx=temp.getContext('2d');const id=tctx.createImageData(width,height);
      for(let i=0,j=0;i<raw.length;i+=channels,j+=4){id.data[j]=raw[i];id.data[j+1]=raw[i+1]??raw[i];id.data[j+2]=raw[i+2]??raw[i];id.data[j+3]=channels===4?(raw[i+3]??255):255}
      tctx.putImageData(id,0,0);c.width=targetW;c.height=targetH;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(temp,0,0,targetW,targetH);
      outputBlob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.96));
      document.getElementById('enhance-preview').innerHTML=`<img src="${URL.createObjectURL(outputBlob)}" alt="AI enhanced 4K result">`;document.getElementById('enhance-output-size').textContent=`Output: ${targetW} × ${targetH}`;document.getElementById('enhance-progress-bar').style.width='100%';setStatus('AI 4K ready');
      state.aiUpscales++;save();toast(localStorage.getItem('rosypics-razorpay-key')?'AI enhancement complete · ₹12':'AI enhancement complete · ₹12');
    }catch(err){console.error(err);setStatus('AI unavailable');toast('AI enhancement failed. Try a smaller image or another browser.');}
    finally{run.dataset.busy='0';run.disabled=false;run.textContent='AI Enhance · ₹12'}
  };
  document.getElementById('enhance-download').onclick=()=>{if(!outputBlob){toast('Enhance an image first');return}const a=document.createElement('a');a.href=URL.createObjectURL(outputBlob);a.download=(sourceFile?.name||'rosypics-image').replace(/\.[^.]+$/,'')+'-AI-4K.jpg';document.body.appendChild(a);a.click();a.remove();toast('AI 4K download started')};
}

function initViewer3D(){
  const input=document.getElementById('viewer-file'),drop=document.getElementById('viewer-upload'),stage=document.getElementById('viewer-stage'),card=document.getElementById('viewer-card');
  if(!input||!drop||!stage||!card)return;
  let rx=-8,ry=0,scale=1,dragging=false,lastX=0,lastY=0,auto=false,raf=0;
  const apply=()=>{card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) scale(${scale})`};apply();
  let currentImage={url:'',name:'',file:null};
  const load=file=>{if(!file||!file.type.startsWith('image/')){toast('Please choose an image file');return}const url=URL.createObjectURL(file);currentImage={url,name:file.name,file};card.querySelector('.viewer-front').innerHTML=`<img src="${url}" alt="3D photo">`;document.getElementById('viewer-stat').textContent=file.name;const cb=document.getElementById('viewer-icon-toggle');if(cb)cb.checked=false;toast('Image loaded into 3D viewer')};
  const loadOwned=a=>{currentImage={url:a.url,name:a.name,file:null};card.querySelector('.viewer-front').innerHTML=`<img src="${a.url}" alt="3D photo">`;document.getElementById('viewer-stat').textContent=a.name;const cb=document.getElementById('viewer-icon-toggle');if(cb)cb.checked=(state.orbitImages||[]).some(x=>x.sourceId===a.id&&x.enabled);};
  input.onchange=e=>load(e.target.files[0]);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
  stage.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;ry+=dx*.45;rx-=dy*.45;rx=Math.max(-75,Math.min(75,rx));apply()});
  stage.addEventListener('pointerup',()=>dragging=false);stage.addEventListener('pointercancel',()=>dragging=false);
  stage.addEventListener('wheel',e=>{e.preventDefault();scale+=e.deltaY<0?.08:-.08;scale=Math.max(.65,Math.min(1.55,scale));apply()},{passive:false});
  document.querySelectorAll('[data-view-owned]').forEach(b=>b.onclick=()=>{const a=getOwned3DAssets().find(x=>x.id===b.dataset.viewOwned);if(a)loadOwned(a)});
  const iconToggle=document.getElementById('viewer-icon-toggle');if(iconToggle)iconToggle.onchange=()=>{if(!currentImage.url){iconToggle.checked=false;toast('Load an image first');return}addOrbitImage(currentImage.name,currentImage.url,currentImage.file,currentImage.sourceId||null,iconToggle.checked)};
  document.getElementById('viewer-reset').onclick=()=>{rx=-8;ry=0;scale=1;apply()};
  document.getElementById('viewer-auto').onclick=()=>{auto=!auto;document.getElementById('viewer-auto').textContent=auto?'Stop Auto Rotate':'Auto Rotate';if(auto)spin()};
  function spin(){if(!auto)return;ry+=.35;apply();raf=requestAnimationFrame(spin)}
}

  const next=document.getElementById('book-next');if(next)next.onclick=()=>{const a=getAlbum(state.activeAlbumId);const total=a?a.items.length:0;const pages=Math.ceil(total/2);if(state.bookPage<pages-1){state.bookPage++;render()}};
  const pay=document.getElementById('pay'); if(pay)pay.onclick=checkoutDemo;
}

function applyGiftCode(){
  const code=(document.getElementById('gift-code')?.value||'').trim().toUpperCase();
  if(!code){toast('Enter a gift card code');return}
  let card=state.giftCards[code];
  if(card && card.redeemed){toast('Gift card code is invalid or already used');return}
  // Single-file demo: gift codes carry their purchased value, so a recipient can
  // enter a code even on a different browser/device. A real multi-user system
  // should validate/redeem these server-side to prevent copying or forgery.
  if(!card){
    const parts=code.split('-');
    if(parts.length===3 && parts[0]==='ROSY'){
      const decoded=parseInt(parts[1],36);
      if([300,600,1200,2400].includes(decoded)){
        card={balance:decoded,redeemed:false};
        state.giftCards[code]=card;
      }
    }
  }
  if(!card || card.redeemed){toast('Gift card code is invalid or already used');return}
  state.giftBalance+=Number(card.balance||0);
  card.redeemed=true;
  state.giftApplied=0;
  state.giftCode='';
  save();render();toast('Gift card added to your balance');
}

function handleFile(box,file){
  if(!file)return;
  const id=box.dataset.upload;
  state.uploads[id]=file;
  box.innerHTML='<span style="font-size:17px">✓ <strong>'+file.name+'</strong><br>Image attached</span>';
  toast(id+' image attached');
}

async function forceDownload(url,filename){
  try{
    const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename||url.split('/').pop()||'RosyPics-file';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Download started');
  }catch(err){window.open(url,'_blank');toast('Opened the original file — use Save if your browser blocks the download');}
}
function sendCCOrderEmail(order){
  const ccItems=order.items.filter(x=>x.id==='Vibrant'||x.id==='Pop');
  if(!ccItems.length)return;
  const files=ccItems.map(x=>({type:x.id,file:state.uploads[x.id]})).filter(x=>x.file instanceof File);
  if(files.length!==ccItems.length){toast('Please attach the image for each Custom CC order');return false;}
  const totalBytes=files.reduce((n,x)=>n+x.file.size,0);
  if(totalBytes>10*1024*1024){toast('CC attachments are too large. Please keep the total under 10 MB.');return false;}
  // Submit as a real multipart/form-data HTML form. FormSubmit's documented
  // file-upload endpoint expects native file inputs; using the same field name
  // for each attachment keeps multiple uploads in the same email.
  let mailFrame=document.getElementById('rosypics-mail-frame');
  if(!mailFrame){
    mailFrame=document.createElement('iframe');
    mailFrame.name='rosypics-mail-frame';
    mailFrame.id='rosypics-mail-frame';
    mailFrame.style.position='fixed';
    mailFrame.style.left='-10000px';
    mailFrame.style.top='-10000px';
    mailFrame.style.width='1px';
    mailFrame.style.height='1px';
    mailFrame.style.border='0';
    document.body.appendChild(mailFrame);
  }
  const form=document.createElement('form');
  form.method='POST';
  form.action='https://formsubmit.co/froodyofficial@gmail.com';
  form.enctype='multipart/form-data';
  form.encoding='multipart/form-data';
  form.target='rosypics-mail-frame';
  form.style.position='fixed';
  form.style.left='-10000px';
  form.style.top='-10000px';
  form.style.width='1px';
  form.style.height='1px';
  form.style.opacity='0';
  const fields={_subject:`RosyPics Custom CC Order ${order.id}`,email:order.email,order_id:order.id,customer_email:order.email,order_items:ccItems.map(x=>x.name).join(', '),message:`New RosyPics Custom Colour Grading order.\nOrder: ${order.id}\nCustomer: ${order.email}\nItems: ${ccItems.map(x=>x.name).join(', ')}\nTotal: ₹${order.total}\nPlease colour-grade the attached image(s) and send the finished file(s) back to the customer.`};
  Object.entries(fields).forEach(([name,value])=>{const i=document.createElement('input');i.type='hidden';i.name=name;i.value=value;form.appendChild(i)});
  const template=document.createElement('input');template.type='hidden';template.name='_template';template.value='table';form.appendChild(template);
  const captcha=document.createElement('input');captcha.type='hidden';captcha.name='_captcha';captcha.value='true';form.appendChild(captcha);
  files.forEach((x,i)=>{
    const input=document.createElement('input');
    input.type='file';
    input.name='attachment';
    input.accept='image/*';
    const dt=new DataTransfer();
    dt.items.add(x.file);
    input.files=dt.files;
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  setTimeout(()=>form.remove(),15000);
  toast('CC order sent with image attachment to '+CC_EMAIL);
  return true;
}
function checkoutDemo(){
  const email=document.getElementById('email')?.value.trim();
  if(!email || !email.includes('@')){toast('Please enter a valid email');return}
  const items=state.cart.map(x=>({...x}));
  const total=cartTotal();
  const giftItems=items.filter(x=>x.gift);
  if(giftItems.length && state.paymentMethod==='gift'){toast('Gift cards must be purchased by card');return}
  const useGift=state.paymentMethod==='gift' ? Math.min(state.giftBalance,total) : Math.min(state.giftApplied||0,total);
  if(state.paymentMethod==='gift' && useGift<=0){toast('No gift card balance available');return}
  if(useGift>0){state.giftBalance-=useGift;}
  state.email=email;
  state.lastOrder=items;
  const order={id:'RP-'+Date.now().toString().slice(-6),date:new Date().toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),email,total,paidWith:useGift===total?'Gift Card':(useGift>0?'Gift Card + Card':'Card'),giftUsed:useGift,items:items};
  // Gift cards are issued instantly after a successful purchase.
  order.giftCodes=[];
  giftItems.forEach(x=>{
    const amount=giftAmount(x);
    if(!amount)return;
    const code=makeGiftCode(amount);
    state.giftCards[code]={balance:amount,redeemed:false};
    order.giftCodes.push({code,balance:amount});
  });
  const hasCC=items.some(x=>x.id==='Vibrant'||x.id==='Pop');
  if(hasCC && !sendCCOrderEmail(order))return;
  state.orders.push(order);
  items.forEach(x=>{
    if(x.id==='midnight'){state.collector=true;}
    if(x.id==='angry'){
      if(!state.purchasedPhotos.includes('angry'))state.purchasedPhotos.push('angry');
    }
    if(x.id==='midnight'&&!state.purchasedBundles.includes('midnight'))state.purchasedBundles.push('midnight');
    if(x.id==='interested'&&!state.purchasedBundles.includes('interested'))state.purchasedBundles.push('interested');
  });
  state.cart=[];state.giftApplied=0;state.giftCode='';state.paymentMethod='card';save();
  toast('Payment successful');setTimeout(()=>go('thanks'),650);
}
// Repair Angry Rosy ownership from existing completed orders.
(function repairAngryOwnership(){
  let changed=false;
  const orders=Array.isArray(state.orders)?state.orders:[];
  for(const order of orders){
    if(!order || !Array.isArray(order.items)) continue;
    for(const item of order.items){
      if(item && item.id==='angry'){
        if(!state.purchasedPhotos.includes('angry')){
          state.purchasedPhotos.push('angry');
          changed=true;
        }
        break;
      }
    }
  }
  if(changed)save();
})();

// Repair older demo orders that were marked completed before gift codes were stored.
(function repairGiftOrders(){
  let changed=false;
  (state.orders||[]).forEach(order=>{
    if(!order || !Array.isArray(order.items)) return;
    if(!Array.isArray(order.giftCodes)) order.giftCodes=[];
    order.items.forEach(item=>{
      if(!item || !(item.gift || String(item.id||'').startsWith('gift') || /gift card/i.test(item.name||''))) return;
      const amount=giftAmount(item);
      if(!amount)return;
      const existing=order.giftCodes.find(g=>Number(g.balance)===amount);
      if(!existing){
        const code=makeGiftCode(amount);
        order.giftCodes.push({code,balance:amount});
        state.giftCards[code]={balance:amount,redeemed:false};
        changed=true;
      }
    });
  });
  if(changed)save();
})();
if(!state.collector && state.orders.some(o=>Array.isArray(o.items)&&o.items.some(x=>x&&x.id==='midnight'))){state.collector=true;save();}
midnightDeadline();
render();

// Desktop screenshot deterrence.
// Browsers cannot guarantee blocking OS-level screenshots, but we can reliably
// protect the page when the browser loses focus / becomes hidden and keep the
// protection overlay itself sharp.
(function initCaptureProtection(){
  const shield=document.getElementById('captureShield');
  let timer;
  let protectedNow=false;

  function setProtected(on){
    if(!shield)return;
    protectedNow=!!on;
    shield.classList.toggle('show',protectedNow);
    document.body.classList.toggle('capture-protected',protectedNow);
  }

  function showShield(){
    if(!shield)return;
    setProtected(true);
    clearTimeout(timer);
    // Do not auto-remove the shield merely because a timer elapsed. It should
    // stay up until the browser is focused again.
  }

  function isBlockedShortcut(e){
    const k=(e.key||'').toLowerCase();
    return k==='printscreen' ||
      (e.ctrlKey && ['p','s','u'].includes(k)) ||
      (e.ctrlKey && e.shiftKey && ['s','i','j','c'].includes(k)) ||
      k==='f12';
  }

  document.addEventListener('keydown',e=>{
    if(isBlockedShortcut(e)){
      e.preventDefault();
      e.stopImmediatePropagation();
      showShield();
      void shield.offsetHeight;
    }
  },true);

  document.addEventListener('keyup',e=>{
    if((e.key||'').toLowerCase()==='printscreen'){
      e.preventDefault();
      e.stopPropagation();
      showShield();
    }
  },true);

  document.addEventListener('contextmenu',e=>{
    e.preventDefault();
    showShield();
  },true);

  function handleFocusLoss(){
    if(!document.hasFocus()) showShield();
  }

  window.addEventListener('blur',handleFocusLoss,true);
  window.addEventListener('pagehide',()=>setProtected(true),true);
  window.addEventListener('beforeprint',()=>setProtected(true),true);
  document.addEventListener('pointerdown',()=>{ if(!document.hasFocus()) showShield(); },true);

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden') showShield();
    else if(document.visibilityState==='visible' && document.hasFocus()) setProtected(false);
  },true);

  window.addEventListener('focus',()=>setProtected(false),true);

  // Some Chromium capture paths do not fire a normal blur event immediately.
  // Polling hasFocus closes that gap without affecting normal page navigation.
  setInterval(()=>{
    if(!document.hasFocus()) showShield();
    else if(document.visibilityState==='visible' && protectedNow) setProtected(false);
  },250);
})();

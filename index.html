<style>

:root{

*{box-sizing:border-box}

.green-btn::after{content:"";position:absolute;top:-40%;left:-18%;width:38%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-18deg) translateX(-180%);transition:transform .65s ease;pointer-events:none}

.nav{background:rgba(17,17,17,.78);backdrop-filter:blur(22px) saturate(135%);-webkit-backdrop-filter:blur(22px) saturate(135%);border-bottom:1px solid rgba(255,255,255,.10);box-shadow:0 10px 40px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.04)}
.nav-link{border-radius:999px;padding:10px 14px}.nav-link:hover{background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.18)}
.profile-nav{background:rgba(21,21,21,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.25)}
.cart-nav{background:rgba(26,26,26,.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.22)}
.card-hero-panel,.trading-card,.battle-side,.card-detail-box,.gift-card,.account-card,.order-card,.tool-card{background:linear-gradient(145deg,rgba(28,28,28,.78),rgba(12,12,12,.72));border-color:rgba(255,255,255,.12);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 70px rgba(0,0,0,.28)}

tate(4deg) scale(1.04)}60%{transform:rotate(-3deg) scale(1.02)}80%{transform:rotate(3deg)}}@keyframes packBurst{to{transform:scale(1.3);opacity:0;filter:brightness(2)}}@keyframes revealSpin{0%{transform:rotateY(180deg) scale(.65);opacity:0}55%{opacity:1}100%{transform:rotateY(0) scale(1);opacity:1}}@keyframes caseFade{from{opacity:0}to{opacity:1}}@keyframes impact{from{transform:scale(.25);opacity:1}to{transform:scale(1.8);opacity:0}}@keyframes damagePop{from{transform:translateY(0) scale(.7);opacity:0}25%{opacity:1}to{transform:translateY(-90px) scale(1.15);opacity:0}}

/* RosyCards catalog — every former photo is now a free collectible card. */
const CARD_CATALOG=[
  {id:'angry',name:'Angry Rosy',url:ANGRY4K,rarity:'Rare',power:78,health:105,ability:'Rage Bark',abilityText:'Deals 24 damage. If this card is below 50% health, deal 10 extra damage.',type:'Original Series'},
  {id:'angry-sunshine',name:'Sunshine',url:ANGRY_CC,rarity:'Epic',power:86,health:95,ability:'Sunflare',abilityText:'Deals 20 damage and restores 8 health.',type:'Colour Series'},
  {id:'midnight-1',name:'Nightfall',url:IMG['midnight-rosy-1.jpg'],rarity:'Legendary',power:96,health:120,ability:'Midnight Veil',abilityText:'Deals 28 damage and reduces the opponent’s next attack by 8.',type:'Midnight Collection'},
  {id:'midnight-2',name:'Moonrise',url:IMG['midnight-rosy-2.jpg'],rarity:'Legendary',power:92,health:128,ability:'Moonlit Guard',abilityText:'Restores 18 health and gains 6 temporary power for the next attack.',type:'Midnight Collection'},
  {id:'interested-1',name:'Lookout',url:IMG['interested-1-raw.png'],rarity:'Rare',power:72,health:100,ability:'Curious Stare',abilityText:'Deals 18 damage and draws confidence: your next attack deals 6 extra damage.',type:'Interested Collection'},
  {id:'interested-2',name:'Chill',url:IMG['interested-2-raw.png'],rarity:'Uncommon',power:65,health:112,ability:'Lazy Roll',abilityText:'Deals 15 damage and restores 12 health.',type:'Interested Collection'},
  {id:'interested-3',name:'Watcher',url:IMG['interested-3-raw.png'],rarity:'Rare',power:70,health:108,ability:'Patient Pounce',abilityText:'Deals 17 damage and permanently gains 4 power.',type:'Interested Collection'},
];
function cardById(id){return CARD_CATALOG.find(c=>c.id===id)}
function ownedCardObjects(){return (state.ownedCards||[]).map(cardById).filter(Boolean)}
function collectCard(id){
  if(!cardById(id))return;
  if((state.ownedCards||[]).includes(id)){toast('You already own this card');return;}
  state.ownedCards.push(id);save();render();toast('Card added to your collection — FREE');
}
function collectAllCards(){state.ownedCards=CARD_CATALOG.map(c=>c.id);save();render();toast('All RosyCards collected — FREE')}
function cardAbilityHTML(c){return `<div class="card-ability"><strong>${escapeHtml(c.ability)}</strong><span>${escapeHtml(c.abilityText)}</span></div>`}
function battleStateFromDeck(ids){return ids.map(id=>{const c=cardById(id);return {id,health:c.health,maxHealth:c.health,power:c.power,shield:0,bonus:0}})}
function randomFrom(arr){return arr[Math.floor(Math.random()*arr.length)]}
function startBattle(){
  const owned=state.ownedCards||[];
  if(owned.length<3){toast('Collect at least 3 free cards first');return;}
  const player=owned.slice().sort(()=>Math.random()-.5).slice(0,3);
  const cpu=CARD_CATALOG.slice().sort(()=>Math.random()-.5).slice(0,3).map(c=>c.id);
  state.battle={player:battleStateFromDeck(player),cpu:battleStateFromDeck(cpu),pi:0,ci:0,turn:'player',log:'Choose an action.',over:false,fx:null};
  save();go('battle');
}
function activeBattleSide(side){const b=state.battle;return side==='player'?b.player[b.pi]:b.cpu[b.ci]}
function doBattleAction(action){
  const b=state.battle;if(!b||b.over||b.turn!=='player')return;
  const me=activeBattleSide('player'), enemy=activeBattleSide('cpu'), c=cardById(me.id); let damage=0, text='';
  if(action==='attack'){
    damage=Math.max(5,Math.round(me.power*.22)+me.bonus-(enemy.shield||0)); enemy.shield=0; enemy.health-=damage; me.bonus=0; text=`${c.name} attacks for ${damage}.`;
  }else{
    if(c.id==='angry'){damage=24+(me.health<me.maxHealth*.5?10:0);damage=Math.max(1,damage-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;text=`Rage Bark hits for ${damage}.`;}
    else if(c.id==='angry-sunshine'){damage=Math.max(1,20-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.health=Math.min(me.maxHealth,me.health+8);text=`Sunflare deals ${damage} and heals 8.`;}
    else if(c.id==='midnight-1'){damage=Math.max(1,28-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;enemy.shield=8;text=`Midnight Veil deals ${damage}; the next enemy attack is weakened.`;}
    else if(c.id==='midnight-2'){me.health=Math.min(me.maxHealth,me.health+18);me.bonus+=6;text='Moonlit Guard restores 18 health and empowers the next attack.';}
    else if(c.id==='interested-1'){damage=Math.max(1,18-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.bonus+=6;text=`Curious Stare deals ${damage}; next attack gains 6.`;}
    else if(c.id==='interested-2'){damage=Math.max(1,15-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.health=Math.min(me.maxHealth,me.health+12);text=`Lazy Roll deals ${damage} and heals 12.`;}
    else if(c.id==='interested-3'){damage=Math.max(1,17-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.power+=4;text=`Patient Pounce deals ${damage}; power rises by 4.`;}
    else {damage=Math.max(1,25-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.health=Math.max(1,me.health-4);text=`Prism Pounce deals ${damage}, costing 4 health.`;}
  }
  if(enemy.health<=0){enemy.health=0;b.log=text+' CPU card defeated.';b.fx={actor:'player',target:'cpu',kind:action==='ability'?'ability':'attack',amount:damage,defeated:true};const next=b.ci+1;if(next>=b.cpu.length){b.over=true;b.result='win';b.log+=' You win the battle!';save();render();return}b.ci=next;b.turn='cpu';save();render();setTimeout(()=>{if(state.battle)state.battle.fx=null;cpuBattleTurn()},700);return}
  b.log=text;b.turn='cpu';b.fx={actor:'player',target:'cpu',kind:action==='ability'?'ability':'attack',amount:damage,heal:action==='ability'&&(c.id==='angry-sunshine'||c.id==='midnight-2'||c.id==='interested-2')};save();render();setTimeout(()=>{if(state.battle)state.battle.fx=null;cpuBattleTurn()},700);
}
function cpuBattleTurn(){
  const b=state.battle;if(!b||b.over)return;const me=activeBattleSide('cpu'),enemy=activeBattleSide('player'),c=cardById(me.id);let useAbility=Math.random()<.62;let damage=0,text='';
  if(useAbility){
    if(c.id==='midnight-2'){me.health=Math.min(me.maxHealth,me.health+18);me.bonus+=6;text='CPU used Moonlit Guard.';}
    else if(c.id==='interested-2'){damage=Math.max(1,15-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.health=Math.min(me.maxHealth,me.health+12);text=`CPU used Lazy Roll for ${damage}.`;}
    else if(c.id==='angry-sunshine'){damage=Math.max(1,20-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.health=Math.min(me.maxHealth,me.health+8);text=`CPU used Sunflare for ${damage}.`;}
    else if(c.id==='midnight-1'){damage=Math.max(1,28-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;enemy.shield=8;text=`CPU used Midnight Veil for ${damage}.`;}
    else if(c.id==='interested-1'){damage=Math.max(1,18-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.bonus+=6;text=`CPU used Curious Stare for ${damage}.`;}
    else if(c.id==='interested-3'){damage=Math.max(1,17-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.power+=4;text=`CPU used Patient Pounce for ${damage}.`;}
    else {damage=Math.max(1,25-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.health=Math.max(1,me.health-4);text=`CPU used Prism Pounce for ${damage}.`;}
  }else{damage=Math.max(5,Math.round(me.power*.22)+me.bonus-(enemy.shield||0));enemy.shield=0;enemy.health-=damage;me.bonus=0;text=`CPU attacks for ${damage}.`}
  if(enemy.health<=0){enemy.health=0;b.fx={actor:'cpu',target:'player',kind:useAbility?'ability':'attack',amount:damage,defeated:true};const next=b.pi+1;if(next>=b.player.length){b.over=true;b.result='loss';b.log=text+' Your card was defeated. CPU wins.';save();render();return}b.pi=next;b.turn='player';b.log=text+' Your next card is up.';save();render();return}
  b.log=text;b.turn='player';b.fx={actor:'cpu',target:'player',kind:useAbility?'ability':'attack',amount:damage,heal:useAbility&&(c.id==='midnight-2'||c.id==='interested-2'||c.id==='angry-sunshine')};save();render();setTimeout(()=>{if(state.battle)state.battle.fx=null;render()},700);
}

function repairOwnedCards(){const set=new Set(state.ownedCards||[]);if(state.purchasedPhotos.includes('angry'))set.add('angry');if(state.purchasedBundles.includes('midnight')){set.add('midnight-1');set.add('midnight-2')}if(state.purchasedBundles.includes('interested'))['interested-1','interested-2','interested-3'].forEach(id=>set.add(id));state.ownedCards=[...set].filter(id=>cardById(id));save()}
repairOwnedCards();
function money(n){return '₹'+n}
function midnightDeadline(){
  let d=Number(localStorage.getItem('rosypics-midnight-deadline')||0);
  if(!d || d<=Date.now()){d=Date.now()+8*24*60*60*1000;localStorage.setItem('rosypics-midnight-deadline',String(d));}
  return d;
}
function midnightTimeLeft(){return Math.max(0,midnightDeadline()-Date.now())}
function formatMidnightTime(ms){
  const total=Math.floor(ms/1000),days=Math.floor(total/86400),hours=Math.floor((total%86400)/3600),mins=Math.floor((total%3600)/60),secs=total%60;
  return `${days}d ${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s`;
}
function midnightExpired(){return midnightTimeLeft()<=0}
function makeGiftCode(amount){
  return 'ROSY-'+Number(amount).toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
}
function giftAmount(item){
  if(item && item.gift) return Number(item.gift);
  const m=String(item?.name||'').match(/₹\s*([0-9,]+)/);
  return m ? Number(m[1].replace(/,/g,'')) : 0;
}

function resizeToDataURL(fileOrUrl,max=256){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;img.src=fileOrUrl instanceof File?URL.createObjectURL(fileOrUrl):fileOrUrl})}
function addOrbitImage(name,url,file,sourceId,enabled){

function toggleOrbit(id,enabled){const x=(state.orbitImages||[]).find(v=>v.id===id);if(x){x.enabled=enabled;save();render();}}

function battle(){
  const b=state.battle;
  if(!b)return `<section class="subpage battle-page"><h1>CPU Battle</h1><p class="subtitle">Choose three cards and battle the CPU.</p><div class="battle-start-panel"><h2>Ready?</h2><p>You need at least three cards. Cards are free to collect.</p><button class="green-btn" onclick="go('cards')">Collect Cards</button></div></section>`;
  const p=activeBattleSide('player'),c=activeBattleSide('cpu'),pc=cardById(p.id),cc=cardById(c.id);
  const bar=x=>Math.max(0,Math.min(100,(x.health/x.maxHealth)*100));
  const fx=b.fx||{};
  const sideFx=(side)=>fx.actor===side?'fx-attacker':(fx.target===side?'fx-hit':'');
  const numFor=(side)=>{
    if(fx.target!==side||!fx.amount)return '';
    const heal=fx.heal&&fx.actor===side;
    return `<div class="battle-fx-number ${heal?'heal':'damage'}">${heal?'+':''}${heal?Math.abs(fx.amount):'-'+Math.abs(fx.amount)}</div>`;
  };
  const cardBattle=(x,side)=>{const d=cardById(x.id),rc=rarityClass(d.rarity),defeated=fx.target===side&&fx.defeated;return `<div class="battle-card ${defeated?'fx-defeated':''}"><div class="battle-card-art"><img src="${d.url}" alt="${escapeHtml(d.name)}"></div><strong class="${rc}">${escapeHtml(d.name)}</strong><span class="${rc}">${escapeHtml(d.rarity)}</span><div class="hp-track"><i style="width:${bar(x)}%"></i></div><small>${x.health}/${x.maxHealth} HP</small>${numFor(side)}</div>`};
  const result=b.over?`<div class="battle-result ${b.result==='win'?'victory':'defeat'}">${b.result==='win'?'<div class="win-particles">'+Array.from({length:8},()=>'<i></i>').join('')+'</div>':''}<h2>${b.result==='win'?'Victory':'Defeat'}</h2><p>${escapeHtml(b.result==='win'?'You cleared the CPU deck.':'The CPU cleared your deck.')}</p><button class="green-btn" onclick="startBattle()">Fight Again</button></div>`:'';
  return `<section class="subpage battle-page"><div class="battle-head"><div><h1>CPU Battle</h1><p class="subtitle">${b.over?'Battle complete':(b.turn==='player'?'Your turn':'CPU thinking...')}</p></div><button class="download-btn" onclick="startBattle()">New Battle</button></div><div class="battle-arena"><div class="battle-side ${sideFx('player')}"><div class="battle-flash"></div><h3>YOU</h3>${cardBattle(p,'player')}</div><div class="battle-vs">VS</div><div class="battle-side ${sideFx('cpu')}"><div class="battle-flash"></div><h3>CPU</h3>${cardBattle(c,'cpu')}</div></div><div class="battle-log">${escapeHtml(b.log)}</div>${!b.over?`<div class="battle-actions"><button class="green-btn" ${b.turn!=='player'?'disabled':''} onclick="doBattleAction('attack')">Basic Attack</button><button class="green-btn" ${b.turn!=='player'?'disabled':''} onclick="doBattleAction('ability')">${escapeHtml(pc.ability)}</button></div>`:result}<div class="battle-deck"><h2>Your Deck</h2><div>${b.player.map(x=>{const d=cardById(x.id);return `<button class="deck-card ${x.id===p.id?'active':''}" onclick="${x.id===p.id?'':'toast(\'Deck switching will be added next\')'}"><img src="${d.url}" alt="${escapeHtml(d.name)}"><span class="${rarityClass(d.rarity)}">${escapeHtml(d.name)}</span></button>`}).join('')}</div></div></section>`;

function initEnhancer(){
  const input=document.getElementById('enhance-file'),drop=document.getElementById('enhance-upload'),run=document.getElementById('enhance-run');
  if(!input||!drop||!run)return;
  let sourceFile=null,sourceBlob=null,outputBlob=null,sourceUrl=null;
  const setStatus=(t)=>{const el=document.getElementById('enhance-status');if(el)el.textContent=t};
  const loadFile=file=>{
    if(!file||!file.type.startsWith('image/')){toast('Please choose an image file');return}
    sourceFile=file;sourceBlob=file;
    if(sourceUrl)URL.revokeObjectURL(sourceUrl);sourceUrl=URL.createObjectURL(file);
    const img=new Image();img.onload=()=>{document.getElementById('enhance-source').textContent=file.name;document.getElementById('enhance-source-size').textContent=`${img.naturalWidth} × ${img.naturalHeight}`;document.getElementById('enhance-preview').innerHTML=`<img src="${sourceUrl}" alt="Enhancer preview">`;setStatus('Image loaded');};img.onerror=()=>toast('Could not read that image');img.src=sourceUrl;
  };
  input.onchange=e=>loadFile(e.target.files[0]);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
  drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
  run.onclick=async()=>{
    if(!sourceBlob){toast('Upload an image first');return}
    const paid=await requestAIUpscalePayment();if(!paid)return
    if(run.dataset.busy==='1')return;
    run.dataset.busy='1';run.disabled=true;run.textContent='Loading AI…';document.getElementById('enhance-result').classList.add('show');document.getElementById('enhance-progress-bar').style.width='5%';setStatus('Loading AI model…');
    try{
      const {pipeline,RawImage}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm');
      document.getElementById('enhance-progress-bar').style.width='18%';setStatus('Loading AI model…');
      if(!window.__rosyUpscaler){
        const attempts=[];
        if(navigator.gpu) attempts.push({device:'webgpu',dtype:'fp16'});
        attempts.push({device:'wasm',dtype:'q8'});
        attempts.push({device:'wasm',dtype:'fp32'});
        let lastError=null;
        for(const opts of attempts){
          try{
            setStatus(opts.device==='webgpu'?'Starting GPU AI…':'Starting browser AI…');
            window.__rosyUpscaler=await pipeline('image-to-image','Xenova/swin2SR-realworld-sr-x4-64-bsrgan-psnr',opts);
            break;
          }catch(e){lastError=e;window.__rosyUpscaler=null;console.warn('RosyPics AI engine attempt failed',opts,e)}
        }
        if(!window.__rosyUpscaler) throw lastError||new Error('AI model could not be initialized');
      }
      document.getElementById('enhance-progress-bar').style.width='30%';setStatus('AI running in your browser…');run.textContent='AI Enhancing…';
      const inputImage=await RawImage.fromBlob(sourceBlob);
      const output=await window.__rosyUpscaler(inputImage);
      document.getElementById('enhance-progress-bar').style.width='82%';setStatus('Preparing 4K master…');
      const raw=output.data,width=output.width,height=output.height,channels=output.channels;
      const c=document.createElement('canvas');let targetW=width,targetH=height;
      if(Math.max(targetW,targetH)<3840){const k=3840/Math.max(targetW,targetH);targetW=Math.round(targetW*k);targetH=Math.round(targetH*k)}
      if(Math.max(targetW,targetH)>3840){const k=3840/Math.max(targetW,targetH);targetW=Math.round(targetW*k);targetH=Math.round(targetH*k)}
      const temp=document.createElement('canvas');temp.width=width;temp.height=height;const tctx=temp.getContext('2d');const id=tctx.createImageData(width,height);
      for(let i=0,j=0;i<raw.length;i+=channels,j+=4){id.data[j]=raw[i];id.data[j+1]=raw[i+1]??raw[i];id.data[j+2]=raw[i+2]??raw[i];id.data[j+3]=channels===4?(raw[i+3]??255):255}
      tctx.putImageData(id,0,0);c.width=targetW;c.height=targetH;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(temp,0,0,targetW,targetH);
      outputBlob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.96));
      document.getElementById('enhance-preview').innerHTML=`<img src="${URL.createObjectURL(outputBlob)}" alt="AI enhanced 4K result">`;document.getElementById('enhance-output-size').textContent=`Output: ${targetW} × ${targetH}`;document.getElementById('enhance-progress-bar').style.width='100%';setStatus('AI 4K ready');
      state.aiUpscales++;save();toast('AI enhancement complete · ₹12');
    }catch(err){console.error(err);setStatus('AI unavailable');toast('AI enhancement could not start. Retrying with a compatible engine is automatic; try again if needed.');}
    finally{run.dataset.busy='0';run.disabled=false;run.textContent='AI Enhance · ₹12'}
  };
  document.getElementById('enhance-download').onclick=()=>{if(!outputBlob){toast('Enhance an image first');return}const a=document.createElement('a');a.href=URL.createObjectURL(outputBlob);a.download=(sourceFile?.name||'rosypics-image').replace(/\.[^.]+$/,'')+'-AI-4K.jpg';document.body.appendChild(a);a.click();a.remove();toast('AI 4K download started')};
}

function initViewer3D(){

  const load=file=>{if(!file||!file.type.startsWith('image/')){toast('Please choose an image file');return}const url=URL.createObjectURL(file);currentImage={url,name:file.name,file};card.querySelector('.viewer-front').innerHTML=`<img src="${url}" alt="3D photo">`;document.getElementById('viewer-stat').textContent=file.name;toast('Image loaded into 3D viewer')};

  document.getElementById('viewer-auto').onclick=()=>{auto=!auto;document.getElementById('viewer-auto').textContent=auto?'Stop Auto Rotate':'Auto Rotate';if(auto)spin()};
  function spin(){if(!auto)return;ry+=.35;apply();raf=requestAnimationFrame(spin)}
}

function applyGiftCode(){
  const code=(document.getElementById('gift-code')?.value||'').trim().toUpperCase();
  if(!code){toast('Enter a gift card code');return}
  let card=state.giftCards[code];
  if(card && card.redeemed){toast('Gift card code is invalid or already used');return}
  // Single-file demo: gift codes carry their purchased value, so a recipient can
  // enter a code even on a different browser/device. A real multi-user system
  // should validate/redeem these server-side to prevent copying or forgery.
  if(!card){
    const parts=code.split('-');
    if(parts.length===3 && parts[0]==='ROSY'){
      const decoded=parseInt(parts[1],36);
      if([300,600,1200,2400].includes(decoded)){
        card={balance:decoded,redeemed:false};
        state.giftCards[code]=card;
      }
    }
  }
  if(!card || card.redeemed){toast('Gift card code is invalid or already used');return}
  state.giftBalance+=Number(card.balance||0);
  card.redeemed=true;
  state.giftApplied=0;
  state.giftCode='';
  save();render();toast('Gift card added to your balance');
}

async function forceDownload(url,filename){
  try{
    const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename||url.split('/').pop()||'RosyPics-file';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Download started');
  }catch(err){window.open(url,'_blank');toast('Opened the original file — use Save if your browser blocks the download');}
}
function sendCCOrderEmail(order){
  const ccItems=order.items.filter(x=>x.id==='Vibrant'||x.id==='Pop');
  if(!ccItems.length)return;
  const files=ccItems.map(x=>({type:x.id,file:state.uploads[x.id]})).filter(x=>x.file instanceof File);
  if(files.length!==ccItems.length){toast('Please attach the image for each Custom CC order');return false;}
  const totalBytes=files.reduce((n,x)=>n+x.file.size,0);
  if(totalBytes>10*1024*1024){toast('CC attachments are too large. Please keep the total under 10 MB.');return false;}
  // Submit as a real multipart/form-data HTML form. FormSubmit's documented
  // file-upload endpoint expects native file inputs; using the same field name
  // for each attachment keeps multiple uploads in the same email.
  let mailFrame=document.getElementById('rosypics-mail-frame');
  if(!mailFrame){
    mailFrame=document.createElement('iframe');
    mailFrame.name='rosypics-mail-frame';
    mailFrame.id='rosypics-mail-frame';
    mailFrame.style.position='fixed';
    mailFrame.style.left='-10000px';
    mailFrame.style.top='-10000px';
    mailFrame.style.width='1px';
    mailFrame.style.height='1px';
    mailFrame.style.border='0';
    document.body.appendChild(mailFrame);
  }
  const form=document.createElement('form');
  form.method='POST';
  form.action='https://formsubmit.co/froodyofficial@gmail.com';
  form.enctype='multipart/form-data';
  form.encoding='multipart/form-data';
  form.target='rosypics-mail-frame';
  form.style.position='fixed';
  form.style.left='-10000px';
  form.style.top='-10000px';
  form.style.width='1px';
  form.style.height='1px';
  form.style.opacity='0';
  const fields={_subject:`RosyPics Custom CC Order ${order.id}`,email:order.email,order_id:order.id,customer_email:order.email,order_items:ccItems.map(x=>x.name).join(', '),message:`New RosyPics Custom Colour Grading order.\nOrder: ${order.id}\nCustomer: ${order.email}\nItems: ${ccItems.map(x=>x.name).join(', ')}\nTotal: ₹${order.total}\nPlease colour-grade the attached image(s) and send the finished file(s) back to the customer.`};
  Object.entries(fields).forEach(([name,value])=>{const i=document.createElement('input');i.type='hidden';i.name=name;i.value=value;form.appendChild(i)});
  const template=document.createElement('input');template.type='hidden';template.name='_template';template.value='table';form.appendChild(template);
  const captcha=document.createElement('input');captcha.type='hidden';captcha.name='_captcha';captcha.value='true';form.appendChild(captcha);
  files.forEach((x,i)=>{
    const input=document.createElement('input');
    input.type='file';
    input.name='attachment';
    input.accept='image/*';
    const dt=new DataTransfer();
    dt.items.add(x.file);
    input.files=dt.files;
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  setTimeout(()=>form.remove(),15000);
  toast('CC order sent with image attachment to '+CC_EMAIL);
  return true;
}
function checkoutDemo(){
  const email=document.getElementById('email')?.value.trim();
  if(!email || !email.includes('@')){toast('Please enter a valid email');return}
  const items=state.cart.map(x=>({...x}));
  const total=cartTotal();
  const giftItems=items.filter(x=>x.gift);
  if(giftItems.length && state.paymentMethod==='gift'){toast('Gift cards must be purchased by card');return}
  const useGift=state.paymentMethod==='gift' ? Math.min(state.giftBalance,total) : Math.min(state.giftApplied||0,total);
  if(state.paymentMethod==='gift' && useGift<=0){toast('No gift card balance available');return}
  if(useGift>0){state.giftBalance-=useGift;}
  state.email=email;
  state.lastOrder=items;
  const order={id:'RP-'+Date.now().toString().slice(-6),date:new Date().toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),email,total,paidWith:useGift===total?'Gift Card':(useGift>0?'Gift Card + Card':'Card'),giftUsed:useGift,items:items};
  // Gift cards are issued instantly after a successful purchase.
  order.giftCodes=[];
  giftItems.forEach(x=>{
    const amount=giftAmount(x);
    if(!amount)return;
    const code=makeGiftCode(amount);
    state.giftCards[code]={balance:amount,redeemed:false};
    order.giftCodes.push({code,balance:amount});
  });
  const hasCC=items.some(x=>x.id==='Vibrant'||x.id==='Pop');
  if(hasCC && !sendCCOrderEmail(order))return;
  state.orders.push(order);
  items.forEach(x=>{
    if(x.premium){state.premium=true;}
    if(x.skinId&&!state.ownedSkins.includes(x.skinId)){state.ownedSkins.push(x.skinId);}
    if(x.skinCase){state.ownedCases=(state.ownedCases||0)+1;}
    if(x.id==='midnight'){state.collector=true;}
    if(x.id==='angry'){
      if(!state.purchasedPhotos.includes('angry'))state.purchasedPhotos.push('angry');
    }
    if(x.id==='midnight'&&!state.purchasedBundles.includes('midnight'))state.purchasedBundles.push('midnight');
    if(x.id==='interested'&&!state.purchasedBundles.includes('interested'))state.purchasedBundles.push('interested');
  });
  state.cart=[];state.giftApplied=0;state.giftCode='';state.paymentMethod='card';save();
  toast('Payment successful');const boughtCase=items.some(x=>x.skinCase);setTimeout(()=>{if(boughtCase){openSkinCase();}else{go('thanks')}},650);
}
// Repair Angry Rosy ownership from existing completed orders.
(function repairAngryOwnership(){
  let changed=false;
  const orders=Array.isArray(state.orders)?state.orders:[];
  for(const order of orders){
    if(!order || !Array.isArray(order.items)) continue;
    for(const item of order.items){
      if(item && item.id==='angry'){
        if(!state.purchasedPhotos.includes('angry')){
          state.purchasedPhotos.push('angry');
          changed=true;
        }
        break;
      }
    }
  }
  if(changed)save();
})();

// Repair older demo orders that were marked completed before gift codes were stored.
(function repairGiftOrders(){
  let changed=false;
  (state.orders||[]).forEach(order=>{
    if(!order || !Array.isArray(order.items)) return;
    if(!Array.isArray(order.giftCodes)) order.giftCodes=[];
    order.items.forEach(item=>{
      if(!item || !(item.gift || String(item.id||'').startsWith('gift') || /gift card/i.test(item.name||''))) return;
      const amount=giftAmount(item);
      if(!amount)return;
      const existing=order.giftCodes.find(g=>Number(g.balance)===amount);
      if(!existing){
        const code=makeGiftCode(amount);
        order.giftCodes.push({code,balance:amount});
        state.giftCards[code]={balance:amount,redeemed:false};
        changed=true;
      }
    });
  });
  if(changed)save();
})();
if(!state.collector && state.orders.some(o=>Array.isArray(o.items)&&o.items.some(x=>x&&x.id==='midnight'))){state.collector=true;save();}
midnightDeadline();
render();

document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.getElementById('cardDetailModal');if(m)m.remove()}});
